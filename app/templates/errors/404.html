{% extends "base.html" %}
{% block title %}404 · {{ app_name }}{% endblock %}
{% block content %}
<div class="error-page">
  <p class="error-code">404</p>
  <h1>Page not found</h1>
  <p>The page, task or record you requested does not exist, or it is not available to your account.</p>
  <div class="button-row">
    <a class="btn btn-primary" href="{{ url_for('index') }}">Return to start</a>
    <button class="btn btn-quiet" type="button" data-history-back>Go back</button>
  </div>
</div>
{% endblock %}
