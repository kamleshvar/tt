{% extends "base.html" %}
{% block title %}429 · {{ app_name }}{% endblock %}
{% block content %}
<div class="error-page">
  <p class="error-code">429</p>
  <h1>Too many attempts</h1>
  <p>Please wait a minute before trying again. Repeated failures are rate-limited to protect accounts.</p>
  <div class="button-row">
    <a class="btn btn-primary" href="{{ url_for('index') }}">Return to start</a>
    <button class="btn btn-quiet" type="button" data-history-back>Go back</button>
  </div>
</div>
{% endblock %}
