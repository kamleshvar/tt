{% extends "base.html" %}
{% block title %}500 · {{ app_name }}{% endblock %}
{% block content %}
<div class="error-page">
  <p class="error-code">500</p>
  <h1>Something went wrong</h1>
  <p>The error was logged without credentials. Try again, or contact the administrator if the problem continues.</p>
  <div class="button-row">
    <a class="btn btn-primary" href="{{ url_for('index') }}">Return to start</a>
    <button class="btn btn-quiet" type="button" data-history-back>Go back</button>
  </div>
</div>
{% endblock %}
